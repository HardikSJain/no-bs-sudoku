name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The committed generated code once drifted from the schema: the theme
      # default said 'paper' in app_database.dart and 'dark' in the generated
      # output, so every new install got a theme the source did not specify.
      # Generated code is what runs — it has to be in the diff.
      - name: Verify generated code is current
        run: |
          dart run build_runner build --delete-conflicting-outputs
          if ! git diff --quiet; then
            echo "::error::Generated code is stale. Run: fvm dart run build_runner build --delete-conflicting-outputs"
            git diff --stat
            exit 1
          fi

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

  # Proves the tag compiles all the way through AOT. It deliberately does not
  # produce a shippable artifact: the release signing key lives in
  # android/key.properties, which is gitignored, so this runner cannot sign
  # anything. It used to build --release anyway and Gradle quietly substituted
  # the debug key, so the "release-apk" attached to every tag was debug-signed
  # — unusable on Play and un-installable over a real build. A profile build
  # exercises the same AOT path and is honest about what it is.
  #
  # Cut the actual release locally, where the key is.
  build-check:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build (profile — unsigned, not for distribution)
        run: flutter build apk --profile
